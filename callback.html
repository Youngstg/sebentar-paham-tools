<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Callback - Sebentar Paham Tools</title>
    <style>
        :root {
            --primary: #0284c7;
            --success: #16a34a;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #f0fdf4 0%, #f8fafc 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            max-width: 540px;
            width: 100%;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            text-align: center;
        }
        .icon-circle {
            width: 64px;
            height: 64px;
            background: #dcfce7;
            color: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
        }
        h1 {
            font-size: 1.75rem;
            margin: 0 0 12px 0;
            color: var(--text-main);
        }
        p {
            color: var(--text-muted);
            margin: 0 0 24px 0;
            line-height: 1.5;
        }
        .code-box {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 12px 16px;
            border-radius: 10px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            color: #0f172a;
            word-break: break-all;
            margin-bottom: 20px;
            text-align: left;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0369a1;
        }
        .status-msg {
            margin-top: 16px;
            font-size: 0.875rem;
            color: #15803d;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">&#10003;</div>
        <h1>Otorisasi Berhasil!</h1>
        <p>TikTok telah mengizinkan aplikasi Anda. Kode autentikasi berhasil diterima di bawah ini:</p>

        <div class="code-box" id="code-display">Memuat kode...</div>

        <button class="btn" id="copy-btn" onclick="copyCode()">Salin Kode Otorisasi</button>
        <div class="status-msg" id="forward-status"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code') || 'Tidak ada kode ditemukan';
        const display = document.getElementById('code-display');
        display.innerText = code;

        function copyCode() {
            navigator.clipboard.writeText(code);
            const btn = document.getElementById('copy-btn');
            btn.innerText = 'Tersalin ke Clipboard!';
            btn.style.background = '#16a34a';
        }

        // Automatic forward to local python server if running
        if (code && code !== 'Tidak ada kode ditemukan') {
            const localUrl = 'http://localhost:3000/callback' + window.location.search;
            fetch(localUrl, { mode: 'no-cors' }).then(() => {
                document.getElementById('forward-status').innerText = 'Kode otomatis diteruskan ke PC Anda!';
            }).catch(() => {
                document.getElementById('forward-status').innerText = 'Silakan salin kode di atas jika server lokal belum mendeteksi.';
            });
        }
    </script>
</body>
</html>
